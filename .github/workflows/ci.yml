name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: 语法与静态检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n（所有 .sh）
        run: |
          set -e
          while IFS= read -r f; do
            bash -n "$f"
            echo "ok  $f"
          done < <(git ls-files '*.sh')

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
          shellcheck --version
          mapfile -t files < <(git ls-files '*.sh')
          shellcheck -x -S warning "${files[@]}"

  units:
    name: 离线校验（unit / deploy 渲染，非 root）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DESTDIR 预演 + systemd-analyze verify
        run: bash tests/units.sh
      - name: deploy.sh 托管块（幂等 / 保留块外内容 / 自撞检测）
        run: bash tests/deploy.sh

  e2e:
    name: 端到端（真实 sshd / 无需 libvirt）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备一个回环 sshd（:2222）
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y openssh-server iproute2 curl
          sudo mkdir -p /run/sshd
          sudo ssh-keygen -A
          sudo /usr/sbin/sshd -p 2222 -o PidFile=/tmp/sshd-e2e.pid
          sleep 1
          ss -tlnH | grep ':2222' && echo "sshd 已就绪"

      - name: 跑状态机测试
        env:
          SSH_USER_T: runner
          SSH_PORT_T: 2222
        run: bash tests/e2e.sh ./tunnel.sh

      - name: 失败时保留现场
        if: failure()
        run: |
          echo "=== sshd 日志 ==="; sudo tail -50 /var/log/auth.log 2>/dev/null || true
          echo "=== 测试临时目录 ==="; ls -la /tmp/vrt-e2e.* 2>/dev/null || true

  # 把 3 个 job 汇总成一个必需检查，方便在分支保护里只勾这一项
  ci:
    name: ci
    if: always()
    needs: [syntax, units, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: 汇总
        run: |
          echo "syntax=${{ needs.syntax.result }} units=${{ needs.units.result }} e2e=${{ needs.e2e.result }}"
          [ "${{ needs.syntax.result }}" = "success" ] \
            && [ "${{ needs.units.result }}" = "success" ] \
            && [ "${{ needs.e2e.result }}" = "success" ]
